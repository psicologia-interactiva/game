<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Mi Brújula Emocional</title>
<style>
:root{
  --bg:#fbf6ef; --surface:#ffffff; --surface2:#f3ece3; --text:#2b2520; --muted:#6f655b; --line:#eadfd2;
  --accent:#2f8a7c; --accent-ink:#ffffff; --accent-soft:#d9f1ec;
  --warm:#e0673f; --warm-soft:#fde6db;
  --pA:#2f9d8c; --pB:#b0578f;
  --good:#2e9a55; --warn:#c98a12; --bad:#d4483b;
  --blob1:#ffc9a8; --blob2:#b9e6dc; --blob3:#e2cffa;
  --shadow:0 2px 4px rgba(80,50,20,.05),0 12px 30px rgba(80,50,20,.08);
  --radius:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16131a; --surface:#221e27; --surface2:#2c2732; --text:#f3eee8; --muted:#a9a0ad; --line:#3a3342;
    --accent:#5fd0bd; --accent-ink:#0d1f1c; --accent-soft:#1d3833;
    --warm:#ff8e62; --warm-soft:#3d2620;
    --pA:#5fd0bd; --pB:#e29ccb;
    --good:#6fd08e; --warn:#f0be55; --bad:#ff7b6d;
    --blob1:#5a2f3c; --blob2:#1d4a44; --blob3:#3b2c5c;
    --shadow:0 2px 4px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#16131a; --surface:#221e27; --surface2:#2c2732; --text:#f3eee8; --muted:#a9a0ad; --line:#3a3342;
  --accent:#5fd0bd; --accent-ink:#0d1f1c; --accent-soft:#1d3833;
  --warm:#ff8e62; --warm-soft:#3d2620;
  --pA:#5fd0bd; --pB:#e29ccb;
  --good:#6fd08e; --warn:#f0be55; --bad:#ff7b6d;
  --blob1:#5a2f3c; --blob2:#1d4a44; --blob3:#3b2c5c;
  --shadow:0 2px 4px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
#deck{overflow:hidden;margin:0 -8px;padding:0 8px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh;padding-bottom:calc(96px + env(safe-area-inset-bottom));overflow-x:hidden}
button{font:inherit;color:inherit}
/* fondo animado */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:340px;height:340px;background:var(--blob1);left:-120px;top:10%}
.blobs i:nth-child(2){width:300px;height:300px;background:var(--blob2);right:-110px;top:45%;animation-duration:27s}
.blobs i:nth-child(3){width:260px;height:260px;background:var(--blob3);left:30%;bottom:-120px;animation-duration:31s}
@keyframes drift{to{transform:translate(60px,-50px) scale(1.15)}}
/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:680px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:6px}
.brand{font-family:ui-serif,Georgia,serif;font-weight:700;font-size:17px;flex:1;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden}
.brand svg{flex:none}
@media (max-width:420px){.brand span{display:none}}
.tbtn{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:14px;font-weight:700;cursor:pointer;min-height:38px;white-space:nowrap;transition:transform .15s}
.tbtn:active{transform:scale(.92)}
.tbtn.pause{border-color:var(--warm);color:var(--warm)}
#xp{display:inline-flex;gap:4px;align-items:center}
#xp.bump{animation:bump .5s cubic-bezier(.34,1.8,.64,1)}
@keyframes bump{40%{transform:scale(1.3)}}
.journey{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 10px;max-width:680px;margin:0 auto;scrollbar-width:none}
.journey::-webkit-scrollbar{display:none}
.st{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:16px;border:2px solid transparent;cursor:default;transition:transform .3s,background .3s;position:relative;padding:0}
.st.done{background:var(--accent-soft);cursor:pointer}
.st.cur{background:var(--surface);transform:scale(1.18);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent);animation:pulse 2s ease-in-out infinite}
.st.pa{border-color:var(--pA)}.st.pb{border-color:var(--pB)}
.st:disabled{opacity:.55}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 10%,transparent)}}
main{max-width:680px;margin:0 auto;padding:18px 16px 24px}
h1{font-family:ui-serif,Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(25px,6.6vw,34px);line-height:1.15;margin:.2em 0 .4em;text-wrap:balance}
h2{font-size:20px;margin:0 0 .4em}
h3{font-size:17px;margin:0 0 .45em}
p{margin:0 0 .7em}
.kicker{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;margin:0;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.lead{color:var(--muted);margin:0 0 18px;font-size:16.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:0 0 14px;box-shadow:var(--shadow)}
.card> :last-child{margin-bottom:0}
.card.warm{background:var(--warm-soft);border-color:transparent;box-shadow:none}
.card.soft{background:var(--accent-soft);border-color:transparent;box-shadow:none}
.card.fun{background:linear-gradient(135deg,color-mix(in srgb,var(--blob1) 55%,var(--surface)),color-mix(in srgb,var(--blob3) 55%,var(--surface)));border-color:transparent}
.center{text-align:center}
.btn{appearance:none;border:0;border-radius:999px;padding:12px 22px;font-weight:800;cursor:pointer;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s cubic-bezier(.34,1.8,.64,1),opacity .2s,box-shadow .2s;text-align:center;line-height:1.25;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.94)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 60%,#000 25%)}
.btn.primary:active{box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 60%,#000 25%);transform:translateY(4px)}
.btn.ghost{background:var(--surface);color:var(--text);border:2px solid var(--line)}
.btn.warm{background:var(--warm);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--warm) 60%,#000 25%)}
.btn.small{min-height:40px;padding:8px 15px;font-size:14px;box-shadow:none}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;font-size:15px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:42px;transition:transform .2s cubic-bezier(.34,1.8,.64,1),background .15s,border-color .15s;text-align:left;-webkit-tap-highlight-color:transparent}
.chip:active{transform:scale(.92)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:pop .35s cubic-bezier(.34,1.8,.64,1)}
.chip.sug{border-color:var(--warm)}
.chip.sug::after{content:" ★";color:var(--warm)}
.chip.sug[aria-pressed="true"]::after{color:inherit}
.chips.sm .chip{font-size:14px;min-height:36px;padding:6px 12px}
@keyframes pop{50%{transform:scale(1.12)}}
.grp{font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:800;margin:16px 0 8px}
.grp:first-child{margin-top:0}
textarea,input[type=text]{width:100%;font:inherit;color:var(--text);background:var(--surface2);border:2px solid transparent;border-radius:16px;padding:12px 14px;resize:vertical;margin:0}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--accent);background:var(--surface)}
::placeholder{color:var(--muted);opacity:.8}
label.f,.f{display:block;font-weight:800;margin:16px 0 6px}
.card>label.f:first-child{margin-top:0}
.hint{font-size:14px;color:var(--muted)}
.ok{color:var(--good)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.nav-in{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center}
.nav .primary{flex:1;max-width:380px;margin-left:auto;font-size:15.5px;padding:10px 16px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;padding:5px 12px;border-radius:99px;background:color-mix(in srgb,var(--pc) 16%,transparent);color:var(--pc);margin:0 6px 10px 0}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);padding:4px;border-radius:16px;margin-bottom:12px}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.seg button{appearance:none;border:0;background:transparent;border-radius:12px;padding:9px 6px;font-weight:700;font-size:14px;cursor:pointer;min-height:40px;color:var(--muted);transition:background .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.mode-grid{display:grid;gap:10px}
.mode{appearance:none;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 16px;cursor:pointer;display:flex;gap:14px;align-items:center;transition:transform .2s cubic-bezier(.34,1.8,.64,1),border-color .2s}
.mode:active{transform:scale(.97)}
.mode .mi{font-size:34px;line-height:1}
.mode b{font-size:17px;display:block}
.mode span{color:var(--muted);font-size:14px}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.checkline{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.checkline input{width:22px;height:22px;margin-top:1px;accent-color:var(--accent);flex:none}
/* encabezado de paso y guía */
.shead{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin:2px 0 0}
.shead .sdot{width:4px;height:4px;border-radius:50%;background:var(--muted);opacity:.6}
.howto{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:16px;padding:12px 14px;margin:0 0 16px;box-shadow:var(--shadow)}
.howto .do{margin:0;font-weight:600;display:flex;gap:10px;line-height:1.45}
.why summary{font-size:14px;color:var(--accent);font-weight:800;margin-top:8px;list-style:none;cursor:pointer}
.why summary::before{content:"ⓘ ";}
.why summary::-webkit-details-marker{display:none}
.why p{font-size:14px;color:var(--muted);margin:6px 0 0;line-height:1.5}
.btn.primary.locked{background:var(--surface2);color:var(--muted);box-shadow:none;border:2px dashed var(--line);font-size:15px}
.shake{animation:shake2 .55s}
@keyframes shake2{15%,55%{transform:translateX(-7px)}35%,75%{transform:translateX(7px)}}
.linkbtn{appearance:none;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px;padding:10px 6px;display:block;margin:6px auto 0}
.moments{display:grid;gap:12px;margin:12px 0}
.moment{appearance:none;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:22px;padding:16px;display:grid;grid-template-columns:56px 1fr;column-gap:14px;row-gap:2px;align-items:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.34,1.56,.64,1),border-color .2s,background .2s;-webkit-tap-highlight-color:transparent}
.moment:active{transform:scale(.97)}
.moment .m-ico{grid-row:1/4;font-size:30px;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--surface2);transition:transform .4s cubic-bezier(.34,1.8,.64,1)}
.moment .m-tag{font-size:11px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--warm)}
.moment b{font-size:18px;line-height:1.25}
.moment .m-d{color:var(--muted);font-size:14px;line-height:1.4}
.moment[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.moment[aria-pressed="true"] .m-ico{transform:scale(1.12) rotate(-6deg);background:var(--surface)}
.prow{display:flex;gap:12px;align-items:center}
.pav{width:64px;flex:none}
.pav .avw,.lav .avw{width:100%}
.lrow{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.lav{width:90px;flex:none}
.orb.two{display:flex;gap:0;justify-content:center}
.orb.two .avw{width:42%}
.substeps{display:flex;gap:4px;margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.substeps span{flex:1;min-width:58px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--muted);text-align:center}
.substeps i{display:block;width:100%;height:6px;border-radius:9px;background:var(--line);transition:background .4s}
.substeps .on i{background:var(--accent)}
.substeps .cur{color:var(--accent)}
.substeps .cur i{background:linear-gradient(90deg,var(--accent),var(--warm));animation:pulseBar 1.6s ease-in-out infinite}
@keyframes pulseBar{50%{opacity:.55}}
.fam-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
.fam-grid .fam{justify-content:center;padding:9px 6px;border-radius:14px}
.fam-desc{margin:12px 0 8px}
.wstep{margin:12px 0 0;font-weight:700}
.bodymap{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.bodyfig .body{width:100%;display:block}
.body .silu *{fill:var(--surface2);stroke:var(--line);stroke-width:1.5}
.body .bz{fill:var(--warm);opacity:.16;cursor:pointer;transition:opacity .25s;transform-box:fill-box;transform-origin:center}
.body .bz:hover{opacity:.35}
.body .bz.on{opacity:.9;animation:beat 1.3s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.25)}}
.report-hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--fc) 45%,var(--surface)),var(--surface));border-color:transparent}
.report-hero .rh-av{width:96px;flex:none}.report-hero .rh-av .avw{width:100%}
.report-hero small{display:block;color:var(--muted);font-weight:700;text-transform:capitalize}
.report-hero b{display:block;font-family:ui-serif,Georgia,serif;font-size:26px;line-height:1.2}
.report-hero span{font-size:14px;color:var(--muted);font-weight:600}
.pbar{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.pl{font-weight:700;white-space:nowrap}
.ptrack{height:14px;border-radius:0 4px 4px 0;background:transparent}
.ptrack i{display:block;height:100%;border-radius:0 4px 4px 0;animation:fill .9s cubic-bezier(.2,.8,.2,1) both}
.pv{text-align:right;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{font-size:9px;fill:var(--muted)}
.chart circle{cursor:pointer}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.chip.static{cursor:default}
.mpad{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;aspect-ratio:1.2;width:calc(100% - 48px);max-width:400px;margin:28px auto 0;padding:0 0 0 0;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.mq{border-radius:14px;background:color-mix(in srgb,var(--qc) 55%,var(--surface));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:12.5px;color:#2b2520;font-weight:600;pointer-events:none}
.mq b{font-size:20px}
.mq.rojo{border-top-left-radius:26px}.mq.amarillo{border-top-right-radius:26px}.mq.azul{border-bottom-left-radius:26px}.mq.verde{border-bottom-right-radius:26px}
.max{position:absolute;font-size:11px;font-weight:800;color:var(--muted);pointer-events:none;white-space:nowrap}
.max.y{top:-22px;left:50%;transform:translateX(-50%)}.max.y2{bottom:-22px;left:50%;transform:translateX(-50%)}
.max.x{left:-21px;top:50%;writing-mode:vertical-rl;transform:translateY(-50%) rotate(180deg)}.max.x2{right:-21px;top:50%;writing-mode:vertical-rl;transform:translateY(-50%)}
.mdot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff;border:4px solid #2b2520;box-shadow:0 3px 12px rgba(0,0,0,.3);pointer-events:none;transition:left .15s,top .15s;animation:pop .35s}
#mlbl{margin-top:30px!important;font-weight:800}
.qchip{display:inline-block!important;margin-top:6px;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--qc) 45%,var(--surface));color:#2b2520!important;font-size:12.5px!important}
.outgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.outb{appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px;display:flex;gap:8px;align-items:center;text-align:left;font-size:14px;font-weight:600;cursor:pointer;min-height:54px;transition:transform .2s cubic-bezier(.34,1.8,.64,1)}
.outb span{font-size:24px}
.outb:active{transform:scale(.95)}
.outb[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.dists{display:grid;gap:8px}
.dist{appearance:none;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.dist b{font-size:15px}.dist span{font-size:13.5px;color:var(--muted)}
.dist.sug{border-color:var(--warm)}
.dist[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tools{display:grid;gap:10px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;transition:border-color .3s}
.tool.done{border-color:var(--good)}
.tool-h{appearance:none;border:0;background:none;width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:14px;cursor:pointer}
.tool .ti{font-size:26px;width:46px;height:46px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;flex:none}
.tool .tt{flex:1;min-width:0}.tool .tt b{display:block;font-size:16px}.tool .tt small{display:block;color:var(--muted);font-size:13.5px;line-height:1.35}
.tool .tt em{display:block;font-style:normal;color:var(--warm);font-size:12.5px;font-weight:800;margin-top:3px}
.tool .tdone{font-size:20px;font-weight:900;color:var(--muted)}
.tool.done .tdone{color:var(--good)}
.tool-b{padding:0 14px 16px}
.tprog{display:flex;gap:4px;margin-bottom:10px}.tprog i{flex:1;height:5px;border-radius:9px;background:var(--line)}.tprog i.on{background:var(--accent)}
.tlist{list-style:none;padding:0;margin:0}
.gbig{font-size:48px}
.gdots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.gdot{appearance:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--accent);background:transparent;cursor:pointer;transition:transform .2s}
.gdot.on{background:var(--accent);transform:scale(.9)}
.river{position:relative;height:74px;border-radius:16px;background:linear-gradient(180deg,#bfe3ff,#6fb2e6);overflow:hidden;margin:6px 0 10px}
.leaf{position:absolute;left:12px;top:20px;background:#fff;color:#2b2520;border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px;max-width:85%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:bob 2s ease-in-out infinite}
.leaf.go{transition:transform 2.2s ease-in,opacity 2.2s;transform:translateX(120%) rotate(8deg);opacity:0}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}
.crisis{border:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.crisis a{font-weight:800}
/* entrada de pantallas */
.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.enter.fwd>*{animation-name:inR}.enter.back>*{animation-name:inL}
@keyframes inR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.popin{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
/* ===== avatar ===== */
.av{width:100%;height:auto;display:block;overflow:visible}
.av-body{transform-box:view-box;transform-origin:60px 150px;animation:avBreathe 4s ease-in-out infinite}
@keyframes avBreathe{50%{transform:scale(1.015,1.025)}}
.av-head{transform-box:view-box;transform-origin:60px 96px;transition:transform .6s cubic-bezier(.34,1.56,.64,1)}
.av .brow{fill:#3a2a22;transform-box:fill-box;transform-origin:center;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.av .eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.av .eyes-open,.av .eyes-happy,.av .eyes-closed{transition:opacity .25s,transform .35s;transform-box:fill-box;transform-origin:center}
.av .eyes-happy,.av .eyes-closed{opacity:0}
.av .eyes-happy path,.av .eyes-closed path{fill:none;stroke:#2b2020;stroke-width:3;stroke-linecap:round}
.av .mouth{fill:none;stroke:#5a2a24;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transition:d .45s}
.av .mouth.fill{fill:#8a3030}
.av .tint{transition:fill .5s,opacity .5s}
.av .blush{fill:#ff6b81;opacity:.22;transition:opacity .4s}
.av .fx{opacity:0;transition:opacity .35s}
.av .fx *{transform-box:fill-box;transform-origin:center}
.av .fx-steam circle{fill:#d9d2cc;animation:steam 1.5s ease-out infinite}
.av .fx-steam circle:nth-child(2n){animation-delay:.5s}
@keyframes steam{0%{transform:translateY(8px) scale(.5);opacity:0}40%{opacity:.95}100%{transform:translateY(-16px) scale(1.2);opacity:0}}
.av .fx-tear path{fill:#62b4ff;animation:tear 2s ease-in infinite}
@keyframes tear{0%{transform:translateY(-2px);opacity:0}20%{opacity:1}100%{transform:translateY(18px);opacity:0}}
.av .fx-sweat path{fill:#8fd3ff;animation:tear 1.6s ease-in infinite}
.av .fx-hearts path{fill:#ff4d73;animation:heart 2.4s ease-out infinite}
.av .fx-hearts path:nth-child(2){animation-delay:1.2s}
@keyframes heart{0%{transform:translateY(6px) scale(.4);opacity:0}30%{opacity:1}100%{transform:translateY(-22px) scale(1.1);opacity:0}}
.av .fx-spark text{fill:#ffc21a;font-size:14px;animation:twinkle 1.4s ease-in-out infinite}
.av .fx-spark text:nth-child(2){animation-delay:.7s}
@keyframes twinkle{50%{transform:scale(1.5) rotate(20deg);opacity:.4}}
.av .fx-bang text{fill:#ff9f1a;font-size:24px;font-weight:900;animation:bang .8s ease-in-out infinite}
@keyframes bang{50%{transform:translateY(-4px) scale(1.2)}}
.av .fx-stink path{fill:none;stroke:#6cc36f;stroke-width:2.5;stroke-linecap:round;animation:wig 1s ease-in-out infinite}
@keyframes wig{50%{transform:translateX(3px)}}
.av[data-e=calma] .blush{opacity:.35}
.av[data-e=tenso] .brow.l{transform:translateY(2px) rotate(9deg)}.av[data-e=tenso] .brow.r{transform:translateY(2px) rotate(-9deg)}
.av[data-e=ira] .brow.l{transform:translateY(4px) rotate(22deg)}.av[data-e=ira] .brow.r{transform:translateY(4px) rotate(-22deg)}
.av[data-e=ira] .fx-steam{opacity:1}
.av[data-e=tristeza] .brow.l{transform:translateY(-1px) rotate(-17deg)}.av[data-e=tristeza] .brow.r{transform:translateY(-1px) rotate(17deg)}
.av[data-e=tristeza] .av-head{transform:rotate(-7deg) translateY(3px)}
.av[data-e=tristeza] .fx-tear{opacity:1}
.av[data-e=miedo] .brow.l{transform:translateY(-7px) rotate(-12deg)}.av[data-e=miedo] .brow.r{transform:translateY(-7px) rotate(12deg)}
.av[data-e=miedo] .eyes-open{transform:scale(1.25)}
.av[data-e=miedo] .fx-sweat{opacity:1}
.av[data-e=miedo] .av-body{animation:shiver .18s linear infinite}
@keyframes shiver{50%{transform:translateX(1.2px)}}
.av[data-e=asco] .brow.l{transform:translateY(3px) rotate(14deg)}.av[data-e=asco] .brow.r{transform:translateY(-5px) rotate(-8deg)}
.av[data-e=asco] .fx-stink{opacity:1}
.av[data-e=asco] .av-head{transform:rotate(6deg)}
.av[data-e=sorpresa] .brow{transform:translateY(-9px)}
.av[data-e=sorpresa] .eyes-open{transform:scale(1.35)}
.av[data-e=sorpresa] .fx-bang{opacity:1}
.av[data-e=sorpresa] .av-body{animation:hop .9s ease-in-out infinite}
@keyframes hop{30%{transform:translateY(-6px)}60%{transform:none}}
.av[data-e=felicidad] .eyes-open,.av[data-e=amor] .eyes-open,.av[data-e=zen] .eyes-open{opacity:0}
.av[data-e=felicidad] .eyes-happy,.av[data-e=amor] .eyes-happy{opacity:1}
.av[data-e=felicidad] .blush,.av[data-e=amor] .blush{opacity:.6}
.av[data-e=felicidad] .fx-spark{opacity:1}
.av[data-e=felicidad] .av-body,.av[data-e=amor] .av-body{animation:bounce 1.2s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-5px)}}
.av[data-e=amor] .fx-hearts{opacity:1}
.av[data-e=zen] .eyes-closed{opacity:1}
.av[data-e=zen] .blush{opacity:.35}
.av.hot .av-body{animation:shake .11s linear infinite}
@keyframes shake{25%{transform:translate(-1.5px,.5px) rotate(-1deg)}75%{transform:translate(1.5px,-.5px) rotate(1deg)}}
.avw{width:110px;margin:0 auto}
.scene{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;max-width:340px;margin:0 auto 10px;gap:4px}
.scene .sa{text-align:center;font-weight:800;font-size:14px}
.scene .sa .avw{width:min(120px,100%)}
.scene .mid{font-size:26px;align-self:center;animation:pulseS 1.8s ease-in-out infinite}
@keyframes pulseS{50%{transform:scale(1.25)}}
.scene.swap .sa:first-child{animation:swapR 1.3s cubic-bezier(.65,0,.35,1) both}
.scene.swap .sa:last-child{animation:swapL 1.3s cubic-bezier(.65,0,.35,1) both}
@keyframes swapR{50%{transform:translate(calc(50% + 20px),-24px)}100%{transform:translateX(calc(100% + 40px))}}
@keyframes swapL{50%{transform:translate(calc(-50% - 20px),18px)}100%{transform:translateX(calc(-100% - 40px))}}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 14px;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:inherit;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.bubble b{font-size:20px;font-family:ui-serif,Georgia,serif}
/* hero */
.hero{display:grid;grid-template-columns:1fr 60px 1fr;align-items:end;max-width:330px;margin:4px auto 6px}
.hero .avw{width:100%}
.hero-mid{font-size:30px;text-align:center;align-self:center;transition:transform .5s}
.hero-cap{text-align:center;font-weight:700;color:var(--muted);min-height:1.6em;margin-bottom:14px;transition:opacity .3s}
/* termómetro */
.temp-top{display:flex;align-items:center;gap:14px}
.temp-top .avw{width:110px;flex:none}
.temp-num{font-size:58px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;transition:color .3s}
.temp-desc{color:var(--muted);font-size:15px;min-height:2.6em}
.range{-webkit-appearance:none;appearance:none;width:100%;height:18px;border-radius:99px;background:linear-gradient(90deg,#39b58c,#f2c94c 55%,#e8513f);outline:none;margin:16px 0 6px;cursor:pointer}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;background:#fff;border:4px solid #2b2520;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.range::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid #2b2520}
.range:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.range-labels{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
/* respiración */
.breath{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px}
.orb-wrap{width:230px;height:230px;display:grid;place-items:center}
.orb{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--accent-soft) 25%,var(--accent) 80%);transform:scale(.55);transition:transform 4s ease-in-out;box-shadow:0 0 60px color-mix(in srgb,var(--accent) 45%,transparent);display:grid;place-items:center}
.orb .avw{width:52%}
.b-label{font-size:22px;font-weight:800;margin-top:6px;min-height:1.5em;text-align:center}
.b-count{font-size:14px;color:var(--muted);margin-bottom:10px;font-variant-numeric:tabular-nums}
/* rueda */
.wp .wheel-box{position:relative;width:100%;max-width:310px;margin:0 auto;aspect-ratio:1;overflow:hidden;border-radius:30px;background:radial-gradient(circle,var(--surface) 30%,var(--surface2) 100%)}
.wheel{width:100%;height:100%;display:block;touch-action:manipulation}
.wz{transition:transform .9s cubic-bezier(.65,0,.35,1)}
.wz.intro{animation:spinIn 1.3s cubic-bezier(.2,.8,.2,1)}
@keyframes spinIn{from{transform:rotate(-160deg) scale(.4);opacity:0}}
.wheel path{stroke:var(--surface);stroke-width:1.3;cursor:pointer;transition:opacity .4s,filter .2s}
.wheel path:hover{filter:brightness(1.07)}
.wheel path.sel{stroke:#2b2520;stroke-width:2.6}
.wheel text{pointer-events:none;fill:#2b2520;font-weight:700;dominant-baseline:central;text-anchor:middle;font-family:system-ui,sans-serif}
.wheel .t-core{font-size:9px;font-weight:900;letter-spacing:.05em}
.wheel .t-emo{font-size:15px}
.wheel .t-mid{font-size:6.8px}
.wheel .t-leaf{font-size:6.2px;font-weight:600}
.wheel .fg{transition:opacity .4s}
.wheel .fg.dim{opacity:.3}
.wheel .sug-core{animation:glow 1.5s ease-in-out infinite}
@keyframes glow{50%{filter:brightness(1.18) saturate(1.4)}}
.wheel-out{position:absolute;top:10px;right:10px;z-index:2}
.wheel-hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:13px;font-weight:700;color:var(--muted);pointer-events:none}
.fam-row{display:flex;gap:6px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.fam-row::-webkit-scrollbar{display:none}
.fam{appearance:none;flex:none;border:2px solid transparent;background:color-mix(in srgb,var(--fc) 35%,var(--surface));border-radius:99px;padding:6px 12px 6px 8px;font-weight:800;font-size:14px;cursor:pointer;display:flex;gap:5px;align-items:center;transition:transform .2s cubic-bezier(.34,1.8,.64,1)}
.fam span{font-size:18px}
.fam[aria-pressed="true"]{background:var(--fc);color:#2b2520;border-color:#2b2520;transform:scale(1.06)}
.fam.sug{box-shadow:0 0 0 3px var(--warm)}
.fam.dim{opacity:.5}
.wp-head{display:flex;gap:12px;align-items:center;margin:14px 0 0}
.wp-head>.avw{width:88px;flex:none}
.wp-head .bubble{flex:1}
.mids{display:grid;gap:8px}
.mid-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border-radius:16px;background:color-mix(in srgb,var(--fc) 14%,transparent)}
.wp .chip{border-color:transparent;background:color-mix(in srgb,var(--fc) 30%,var(--surface))}
.wp .chip.mid{font-weight:800}
.wp .chip.leaf{font-size:14px;min-height:36px;padding:6px 12px}
.wp .chip[aria-pressed="true"]{background:var(--fc);color:#2b2520;border-color:#2b2520}
/* iceberg */
.ice{position:relative;height:330px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#cfeeff 0,#e9f7ff 27%,#3d8fc7 27.2%,#1d4f7c 100%);margin:6px 0 4px}
.ice svg.berg{position:absolute;inset:0;width:100%;height:100%}
.ice .wave{position:absolute;left:-50%;width:200%;top:calc(27% - 6px);height:12px;animation:wave 6s linear infinite}
@keyframes wave{to{transform:translateX(25%)}}
.ice .lbl{position:absolute;left:0;right:0;margin:0 auto;width:max-content;background:#fff;color:#2b2520;border-radius:99px;padding:5px 12px;font-weight:800;font-size:14px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 12px rgba(0,0,0,.18);animation:rise .6s both}
.ice .cap{position:absolute;left:12px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.ice .cap.a{top:8px;color:#2d5e80}.ice .cap.b{top:calc(27% + 10px);color:#d6ecff}
/* traductor */
.tr-orig{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:3px;color:var(--muted);font-style:italic;font-size:17px;margin:0}
.tr-row{display:grid;gap:3px;padding:12px 0;border-top:2px dashed var(--line)}
.tr-row:first-child{border-top:0;padding-top:0}
.tr-k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.tr-v{font-size:18px;font-weight:600}
.say{font-family:ui-serif,Georgia,serif;font-size:19px;line-height:1.5;background:var(--accent-soft);border-radius:16px;padding:14px 16px;margin-top:4px;min-height:3em}
.say.type::after{content:"▍";animation:caret 1s steps(1) infinite;color:var(--accent)}
.say.done::after{content:""}
@keyframes caret{50%{opacity:0}}
.horse{background:var(--warm-soft);border-radius:14px;padding:10px 12px;font-size:14px;margin-top:4px}
.horse b{display:block}
.machine{text-align:center;overflow:hidden}
.shred{font-size:22px;font-weight:800;font-family:ui-serif,Georgia,serif;min-height:2.6em;margin-bottom:10px}
.shred span{display:inline-block;animation:shred 1.1s var(--d) both;margin:0 3px}
@keyframes shred{0%{transform:none}25%{color:var(--bad);transform:rotate(-6deg) scale(1.1)}35%{transform:rotate(6deg) scale(1.1)}100%{transform:translateY(60px) rotate(35deg);opacity:0}}
.mbar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.mbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--warm),var(--accent));transform-origin:left;animation:fill 1.3s ease-in-out both}
@keyframes fill{from{transform:scaleX(0)}}
.ba{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;text-align:center;gap:4px;margin:6px 0}
.ba .avw{width:min(110px,100%)}
.ba figure{margin:0}
.ba figcaption{font-size:13px;font-weight:700;color:var(--muted)}
.ba .arrow{font-size:24px}
.saved{list-style:none;padding:0;margin:0}
.saved li{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.saved li:first-child{border-top:0}
.saved .x{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0 4px;margin-left:auto}
/* baraja */
.deck{position:relative;height:190px;margin:8px 4px 12px}
.dcard{position:absolute;inset:0;background:var(--surface);border:2px solid var(--line);border-radius:24px;display:grid;place-items:center;padding:30px 18px;text-align:center;font-family:ui-serif,Georgia,serif;font-size:21px;font-weight:600;box-shadow:var(--shadow);transform:translateY(calc(var(--n) * 10px)) scale(calc(1 - var(--n) * .05));touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;transition:transform .3s}
.dcard[data-top]{z-index:3}
.dtag{position:absolute;top:12px;font-family:system-ui;font-size:13px;font-weight:900;padding:5px 11px;border-radius:99px;color:#fff}
.dtag.r{right:12px;background:var(--good);opacity:var(--r,0)}
.dtag.l{left:12px;background:var(--warm);opacity:var(--l,0)}
.deck-btns{display:flex;align-items:center;gap:8px}
.deck-btns .btn{flex:1}
.deck-count{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.dfb{border-radius:14px;padding:10px 12px;margin-top:10px;font-size:15px}
.dfb.ok{background:color-mix(in srgb,var(--good) 18%,transparent)}
.dfb.no{background:var(--warm-soft)}
.deck-end{text-align:center;padding:10px 0}
.deck-end .stars{font-size:40px;letter-spacing:4px}
.meter-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:10px 0 6px;font-weight:700}
.meter{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;border-radius:99px;transition:width .4s cubic-bezier(.34,1.56,.64,1),background .3s}
.tips{margin:6px 0 0;padding-left:18px;font-size:14px}
.tips li{margin:4px 0}
.checks{list-style:none;padding:0;margin:0;font-size:15px}
.checks li{padding:4px 0;display:flex;gap:8px;transition:color .3s}
.checks li::before{content:"○";color:var(--muted);flex:none;width:1.1em;font-weight:900}
.checks li.y::before{content:"✓";color:var(--good);animation:pop .4s}
details>summary{cursor:pointer;font-weight:800;list-style-position:inside}
/* pozo */
.pozo{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.layer{appearance:none;border:0;text-align:left;background:var(--lc);color:#2b2520;border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;animation:rise .45s ease both}
.layer:nth-child(2){margin:0 10px}.layer:nth-child(3){margin:0 20px}
.layer .e{font-size:24px}
.layer small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.75;font-weight:800}
.layer b{font-size:17px}
.depth{display:flex;gap:5px;margin-bottom:12px}
.depth i{flex:1;height:7px;border-radius:9px;background:var(--line);transition:background .4s}
.depth i.on{background:linear-gradient(90deg,var(--warm),#a594f9)}
/* hand-off */
.hand{text-align:center;padding-top:6px}
.hand .lead{max-width:30em;margin-left:auto;margin-right:auto}
.hand .card{text-align:left}
/* cierre */
.bars{display:grid;gap:14px}
.bar-row .nm{font-weight:800;margin-bottom:4px;display:flex;justify-content:space-between}
.bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%;border-radius:99px;animation:fill 1s cubic-bezier(.2,.8,.2,1) both}
.bar-lbl{font-size:12px;color:var(--muted);font-weight:700}
.summary{white-space:pre-wrap;font-size:14px;background:var(--surface2);border-radius:14px;padding:14px;max-height:300px;overflow:auto}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.bdg{text-align:center;padding:10px 6px;border-radius:16px;background:var(--surface2);font-size:12px;font-weight:700}
.bdg .bi{font-size:30px;display:block}
.bdg.off{opacity:.35;filter:grayscale(1)}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.hist li:first-child{border-top:0}
/* hold */
.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.hold::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.35);transform:scaleX(var(--p,0));transform-origin:left;pointer-events:none}
.hold.done{background:var(--good)!important;color:#fff!important;border-color:var(--good)!important}
.hold span{position:relative}
/* overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,8,12,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:94dvh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
@media (min-width:720px){.overlay{align-items:center}.sheet{border-radius:26px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.icon-btn{appearance:none;border:0;background:var(--surface2);width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:16px}
.big-timer{font-size:60px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0 10px}
.repair{padding-left:18px;margin:6px 0 0}
.repair li{margin:6px 0;font-family:ui-serif,Georgia,serif;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;z-index:70;width:max-content;max-width:calc(100vw - 32px);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

.bpop{position:fixed;z-index:90;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--warm);border-radius:20px;padding:10px 18px 10px 12px;box-shadow:0 14px 40px rgba(0,0,0,.25);animation:bdrop .6s cubic-bezier(.34,1.56,.64,1);width:max-content;max-width:calc(100vw - 32px)}

const LET='A-Za-zÁÉÍÓÚáéíóúÑñÜü';
function gx(t,a,b){
  const f=g=>(m,s)=>g==='o'?s+'o':g==='a'?s+'a':s+'o/a';
  return String(t??'').replace(new RegExp('(['+LET+']*)o\\/a\\b','g'),f(a||'x')).replace(new RegExp('(['+LET+']*)o·a\\b','g'),f(b||'x'));
}

function mixW(hex,t){const n=parseInt(hex.slice(1),16);const c=[n>>16,(n>>8)&255,n&255].map(v=>Math.round(v+(255-v)*t));return`rgb(${c})`;}
const pt=(r,a)=>{const x=a*Math.PI/180;return[+(r*Math.sin(x)).toFixed(2),+(-r*Math.cos(x)).toFixed(2)];};
function arcPath(r0,r1,a0,a1){const L=a1-a0>180?1:0;const p1=pt(r1,a0),p2=pt(r1,a1),p3=pt(r0,a1),p4=pt(r0,a0);return`M${p1}A${r1} ${r1} 0 ${L} 1 ${p2}L${p3}A${r0} ${r0} 0 ${L} 0 ${p4}Z`;}
function radText(r,a,txt,cls){const[x,y]=pt(r,a);const na=((a%360)+360)%360;const rot=na<=180?a-90:a+90;return`<text class="${cls}" x="${x}" y="${y}" transform="rotate(${rot.toFixed(1)} ${x} ${y})">${esc(txt)}</text>`;}

/* ================= confeti y juego ================= */
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=null;
const CCOL=['#f7838f','#6fd3ae','#ab9cfb','#ffb866','#ffe16b','#5fd0bd','#ff4d73'];
function confetti(x=innerWidth/2,y=innerHeight/3,n=90){
  if(RM)return;const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);
  for(let k=0;k<n;k++)parts.push({x,y,vx:(Math.random()-.5)*12,vy:-Math.random()*11-3,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:CCOL[k%CCOL.length],life:0,h:Math.random()<.2});
  if(!raf)raf=requestAnimationFrame(loop);
}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.r+=p.vr;p.life++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;if(p.h){cx.font=`${p.s*2.4}px sans-serif`;cx.fillText('♥',0,0);}else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});
  parts=parts.filter(p=>p.y<innerHeight+30&&p.life<260);
  raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,innerWidth,innerHeight),null);
}

function floatPts(n,el){
  const r=el&&el.getBoundingClientRect?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0};
  const s=document.createElement('div');s.className='fpts';s.textContent=`+${n} 💗`;s.style.left=(r.left+r.width/2)+'px';s.style.top=Math.max(60,r.top)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),1300);
  const x=$('#xp');x.classList.remove('bump');void x.offsetWidth;x.classList.add('bump');
}
function award(key,n,el){if(S.aw[key])return false;S.aw[key]=1;S.xp+=n;save();$('#xpN').textContent=S.xp;floatPts(n,el);return true;}
function badge(id){
  if(S.badges.includes(id))return;S.badges.push(id);save();const[i,t]=BADGES[id];
  const d=document.createElement('div');d.className='bpop';d.innerHTML=`<span class="bi">${i}</span><div><small>¡Logro desbloqueado!</small><b>${esc(t)}</b></div>`;
  document.body.appendChild(d);setTimeout(()=>d.classList.add('out'),2700);setTimeout(()=>d.remove(),3200);confetti(innerWidth/2,70,80);vib([20,40,20]);
}
function holdify(btn,onDone,ms=1100){
  let raf2,t0,prog=0,done=false;
  const reset=()=>{cancelAnimationFrame(raf2);prog=0;btn.style.setProperty('--p',0);};
  const tick=now=>{if(!t0)t0=now;prog=Math.min(1,(now-t0)/ms);btn.style.setProperty('--p',prog);if(prog>=1){done=true;vib(40);onDone();return;}raf2=requestAnimationFrame(tick);};
  btn.addEventListener('pointerdown',e=>{if(done)return;e.preventDefault();t0=0;vib(10);raf2=requestAnimationFrame(tick);});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,()=>{if(!done&&prog<1)reset();}));
  btn.addEventListener('contextmenu',e=>e.preventDefault());
  btn.addEventListener('keydown',e=>{if(!done&&(e.key==='Enter'||e.key===' ')){e.preventDefault();done=true;onDone();}});
}

  [/\b(obviamente|claramente|como siempre|tipico)\b/g,w=>`«${w}» mete una conclusión. Quítala y quédate con lo observable.`],

}

function deckGame(host){
  let idx=0,score=0;
  host.innerHTML=`<div class="deck-area"></div><div class="deck-fb" aria-live="polite"></div>`;
  const area=$('.deck-area',host),fb=$('.deck-fb',host);
  function paint(){
    if(idx>=DECK.length){
      const stars=Math.max(1,Math.round(score/DECK.length*3));
      area.innerHTML=`<div class="deck-end popin"><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><h3>${score} de ${DECK.length}</h3><p class="hint">${score===DECK.length?'¡Ojo de cámara perfecto!':'La mente mezcla hechos e historias todo el tiempo. Ahora sepáralos en tu situación.'}</p><button type="button" class="btn ghost small" id="dAgain">Jugar otra vez</button></div>`;
      $('#dAgain',area).onclick=()=>{idx=0;score=0;fb.innerHTML='';paint();};
      if(score===DECK.length)badge('deck');return;
    }
    area.innerHTML=`<div class="deck">${DECK.slice(idx,idx+3).map((it,n)=>`<div class="dcard" style="--n:${n}" ${n===0?'data-top':''}><span class="dtag l">💭 HISTORIA</span><span class="dtag r">🎥 HECHO</span>«${esc(it[0])}»</div>`).reverse().join('')}</div>
    <div class="deck-btns"><button type="button" class="btn ghost small" data-ans="0">👈 Historia</button><span class="deck-count">${idx+1}/${DECK.length}</span><button type="button" class="btn ghost small" data-ans="1">Hecho 👉</button></div>`;
    const top=$('[data-top]',area);let sx=0,dx=0,drag=false,busy=false;
    top.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;dx=0;try{top.setPointerCapture(e.pointerId)}catch(_){}top.style.transition='none';});
    top.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;top.style.transform=`translateX(${dx}px) rotate(${dx/14}deg)`;top.style.setProperty('--r',Math.max(0,Math.min(1,dx/90)));top.style.setProperty('--l',Math.max(0,Math.min(1,-dx/90)));});
    const end=()=>{if(!drag)return;drag=false;top.style.transition='';if(Math.abs(dx)>80)decide(dx>0?1:0);else{top.style.transform='';top.style.setProperty('--r',0);top.style.setProperty('--l',0);}};
    top.addEventListener('pointerup',end);top.addEventListener('pointercancel',end);
    $$('[data-ans]',area).forEach(b=>b.onclick=()=>decide(+b.dataset.ans));
    function decide(a){
      if(busy)return;busy=true;const it=DECK[idx],ok=a===it[1];if(ok)score++;
      top.style.transition='transform .45s ease,opacity .45s';top.style.transform=`translateX(${a?150:-150}%) rotate(${a?28:-28}deg)`;top.style.opacity=0;
      fb.innerHTML=`<div class="dfb ${ok?'ok':'no'} popin"><b>${ok?'✅ ¡Bien! ':'🤔 Casi. '}${it[1]?'Es un hecho: una cámara lo grabaría.':'Es una historia: una conclusión que la cámara no graba.'}</b>${it[2]?`<br>🎥 Versión cámara: «${esc(it[2])}»`:''}</div>`;
      if(ok)award('deck'+idx,3,fb);vib(ok?20:[10,50,10]);
      timers.push(setTimeout(()=>{idx++;paint();},650));
    }
  }
  paint();
}

      :`<div class="ba"><figure>${avatarSVG(o,fam)}<figcaption>Lo que quizá sentía ${esc(N(o))}</figcaption></figure><span class="arrow">💭</span><figure id="after2">${avatarSVG(i,'neutral')}<figcaption>Tú, respondiendo sin escalar</figcaption></figure></div>`;
    el.innerHTML=`<div class="card popin">
      <div class="tr-row"><span class="tr-k">${decir?'Lo que quieres decir':'Lo que te dijeron'}</span><p class="tr-orig">«${esc(tr.text)}»</p></div>
      <div class="tr-row">${scene}</div>

      <div class="tr-row"><span class="tr-k">${decir?'Lo que necesitas':'Lo que quizá necesita'}</span><span class="tr-v">${esc(nTxt)}</span></div>
      ${decir&&impact?`<div class="tr-row"><span class="tr-k">Así le puede llegar a ${esc(N(o))}</span><span class="tr-v">Se sentirá ${esc(gx(impact,gS,gO))}. Y quien se siente así se defiende, no escucha.</span></div>`:''}
      ${hz?`<div class="tr-row">${hz}</div>`:''}
      <div class="tr-row"><span class="tr-k">${decir?'🗣️ Dilo así':'🗣️ Una respuesta que no escala'}</span><div class="say" id="sayT"></div></div>

    $('#trSave').onclick=e=>{p.trans.push({text:tr.text.trim(),dir:tr.dir,under:uTxt,need:nTxt,line});save();award('tr'+i+'_'+p.trans.length,10,e.currentTarget);badge('traductor');e.currentTarget.textContent='Guardada ✓';e.currentTarget.disabled=true;paintSaved();updateNav();};
    $('#trNew').onclick=()=>{tr.text='';tr.res=null;$('#trIn').value='';paintOut();$('#trIn').focus();updateNav();};
  }
  function paintSaved(){

    el.innerHTML=`<div class="card"><h3>Tus frases guardadas</h3>${S.mode==='juntos'?'<p class="hint">🔒 Privadas.</p>':''}<ul class="saved">${p.trans.map((t,n)=>`<li><div><div class="tr-orig" style="font-size:15px">«${esc(t.text)}»</div><div>${esc(t.line)}</div></div><button type="button" class="x" data-del="${n}" aria-label="Borrar">✕</button></li>`).join('')}</ul></div>`;
    $$('[data-del]',el).forEach(b=>b.onclick=()=>{p.trans.splice(+b.dataset.del,1);save();paintSaved();updateNav();});

V.excavador=i=>{
  const p=P(i),d=p.dig,g=p.g,o=1-i;
  const SUB=['Por fuera','Por dentro','Miedo','Necesidad','Iceberg'];
  app.innerHTML=head('excavador',i,'¿Qué había debajo del enojo?')+'<div id="ex"></div>';
  const ex=$('#ex');
  const subnav=()=>`<div class="substeps" aria-label="Avance">${SUB.map((s,n)=>`<span class="${n<d.step?'on':''}${n===d.step?' cur':''}"><i></i>${s}</span>`).join('')}</div>`;
  function layers(){
    const L=[];
    if(d.surf&&d.step>0){const F=selFam(d.surf);L.push([0,F.e,'Por fuera',selWord(d.surf,g),mixW(F.c,.3)]);}
    if(d.deep&&d.step>1){const F=selFam(d.deep);L.push([1,F.e,'Por dentro',selWord(d.deep,g),mixW(F.c,.3)]);}
    return L.length&&d.step<4?`<div class="pozo">${L.map(([st,e,n,v,c])=>`<button type="button" class="layer" data-lay="${st}" style="--lc:${c}"><span class="e">${e}</span><span><small>${n} · tocar para cambiar</small><b>${esc(v)}</b></span></button>`).join('')}</div>`:'';
  }
  function paint(){
    let q='';
    if(d.step===0)q=`<h3>La punta del iceberg</h3><p>Durante la pelea, ¿qué vio ${esc(N(o))} en ti? Lo que se notaba por fuera.</p><div id="wpk"></div>`;
    else if(d.step===1)q=`<h3>Bajo el agua</h3><p>Por fuera se veía «${esc(selWord(d.surf,g).toLowerCase())}». Pero por dentro, ¿qué sentías? El enojo suele proteger <b>tristeza</b> o <b>miedo</b> (marcadas con ★).</p><div id="wpk"></div>`;
    else if(d.step===2){const df=selFam(d.deep);const s=df?FEAR_SUG[df.k]:[];
      q=`<h3>El miedo de fondo</h3><p>Si eso que sentías pudiera hablar, terminaría la frase <b>«Tengo miedo de que…»</b></p><div class="chips" id="fears">${L4.map(x=>`<button type="button" class="chip ${s.includes(x.t)?'sug':''}" data-fear="${esc(x.t)}" aria-pressed="${d.l4===x.t&&!d.l4x}">…${esc(gx(x.t,g))}</button>`).join('')}</div>
      <input type="text" id="own" placeholder="O escríbelo con tus palabras…" value="${esc(d.l4x)}" style="margin-top:12px">
      <label class="f" for="orig">¿Te recuerda a algo de antes? <span class="hint">· opcional</span></label><input type="text" id="orig" value="${esc(d.origin)}" placeholder="Ej.: me pasaba con mi papá: hablaba y nadie me hacía caso">`;}
    else if(d.step===3){const f=L4.find(x=>x.t===d.l4&&!d.l4x);const sug=uniq([...(f?f.n:[]),d.deep&&d.deep.m!=null?WHEEL[d.deep.f].m[d.deep.m][2]:''].filter(Boolean));
      q=`<h3>¿Qué necesitabas y no recibiste?</h3><p class="hint">Elige de 1 a 3. ${sug.length?'Las marcadas con ★ van con lo que encontraste.':''}</p><div id="needs">${Object.entries(NEEDS).map(([grp,arr])=>`<p class="grp">${grp}</p><div class="chips">${arr.map(n=>`<button type="button" class="chip ${sug.includes(n)?'sug':''}" data-need="${esc(n)}" aria-pressed="${p.needs.includes(n)}">${esc(G(n,i))}</button>`).join('')}</div>`).join('')}</div>`;}
    else{
      const sf=selFam(d.surf),df=selFam(d.deep);
      q=`<h3>Tu iceberg</h3>${iceberg(i)}
      <div class="scene" style="margin-top:14px"><div class="sa">${avatarSVG(i,sf?sf.k:'ira')}Lo que se vio</div><div class="mid">➜</div><div class="sa">${avatarSVG(i,df?df.k:'tristeza')}Lo que había</div></div>
      <p>${esc(N(o))} vio tu <b>${esc(sf?FAM_NOUN[sf.k]:'reacción')}</b>. Lo que necesitaba ver era ${d.deep&&d.deep.m==null?'tu':'que te sentías'} <b>${esc(d.deep&&d.deep.m==null?FAM_NOUN[df.k]:deepNoun(i))}</b>.</p>
      <p class="hint">La punta del iceberg invita al otro a defenderse. Lo de abajo invita a acercarse. Eso es lo que vas a mostrar en tu mensaje.</p>`;
    }
    ex.innerHTML=`${subnav()}${layers()}<div class="card popin" id="exc">${q}</div>`;
    if(d.step<2){
      const key=d.step===0?'surf':'deep';
      wheelPicker($('#wpk'),{g,ai:i,sel:d[key],prompt:d.step===0?'Por fuera se veía…':'Por dentro sentía…',sug:d.step===0?['ira','asco']:['tristeza','miedo'],dim:d.step===1&&d.surf?[WHEEL[d.surf.f].k].filter(k=>k==='ira'||k==='asco'):[],onChange:s=>{d[key]=s;save();}});
    }
    $$('[data-fear]',ex).forEach(b=>b.onclick=()=>{d.l4=b.dataset.fear;d.l4x='';$('#own',ex).value='';save();$$('[data-fear]',ex).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
    const own=$('#own',ex);if(own)own.oninput=()=>{d.l4x=own.value.trim();if(d.l4x){d.l4='';$$('[data-fear]',ex).forEach(x=>x.setAttribute('aria-pressed','false'));}save();};
    const og=$('#orig',ex);if(og)og.oninput=()=>{d.origin=og.value;save();};
    $$('[data-need]',ex).forEach(b=>b.onclick=()=>{const n=b.dataset.need,k=p.needs.indexOf(n);if(k>=0)p.needs.splice(k,1);else{if(p.needs.length>=3){toast('Máximo 3: quédate con las más importantes');return;}p.needs.push(n);}b.setAttribute('aria-pressed',String(p.needs.includes(n)));save();});
    $$('[data-lay]',ex).forEach(b=>b.onclick=()=>sub(+b.dataset.lay));
  }
  function sub(n){d.step=n;save();if(n===4&&d.deep&&award('fondo'+i,25,$('#ex')))badge('fondo');if(n===4)confetti(innerWidth/2,innerHeight/2,50);paint();updateNav();window.scrollTo({top:0,behavior:RM?'auto':'smooth'});}
  paint();
  setGate(()=>{
    const back={onBack:d.step>0?()=>sub(d.step-1):null};
    if(d.step===0)return d.surf?{ok:true,label:'Siguiente: lo de adentro ➜',onNext:()=>sub(1)}:{ok:false,msg:'Elige lo que se veía por fuera',focus:'#exc'};
    if(d.step===1)return d.deep?{...back,ok:true,label:'Siguiente: el miedo ➜',onNext:()=>sub(2)}:{...back,ok:false,msg:'Elige lo que sentías por dentro',focus:'#exc'};
    if(d.step===2)return{...back,ok:true,label:d.l4||d.l4x?'Siguiente: la necesidad ➜':'No lo sé, seguir ➜',onNext:()=>sub(3)};
    if(d.step===3)return p.needs.length?{...back,ok:true,label:'Ver mi iceberg ➜',onNext:()=>sub(4)}:{...back,ok:false,msg:'Elige al menos una necesidad',focus:'#needs'};
    return{...back,ok:true,label:'Siguiente'};
  });
};

    const e=n>=6?'amor':n>=5?'calma':n>=3?'neutral':'ira';setAv($('#lav'),e,7);$('#lmood').textContent=n>=6?'💞 Se acerca':n>=5?'🙂 Escucha':n>=3?'😐 Con cautela':'😠 A la defensiva';

V.espejo=k=>{

    <label class="f" for="valid">3 · Tiene sentido que te sientas así porque… <span class="hint">· opcional</span></label><textarea id="valid" rows="2" placeholder="Tiene sentido que te sintieras ${esc(deepNoun(k)||'así')} porque…">${esc(m.valid)}</textarea><div id="def"></div></div>`;
    wheelPicker($('#wpk'),{g:P(l).g,ai:l,sel:m.feel,prompt:'Si me lo hicieran a mí…',sug:deepK?[deepK.k]:[],onChange:s=>{m.feel=s;save();setAv($('#avL'),WHEEL[s.f].k,6);}});
    const chk=()=>{const t=norm(m.para+' '+m.valid);$('#def').innerHTML=DEFENSIVE.test(t)?`<div class="warnbox">🛡️ Parece que se coló una defensa («pero», «yo no…», «no es cierto»). Es normal. Guárdala para tu turno: ahora solo refleja lo que ${esc(N(k))} vivió.</div>`:'';};
    ['para','valid'].forEach(id=>$('#'+id).oninput=e=>{m[id]=e.target.value;save();chk();});
    chk();
    setGate(()=>{
      if(!m.feel)return{ok:false,msg:'Elige cómo te sentirías tú',focus:'#wcard'};
      if(m.para.trim().length<8)return{ok:false,msg:'Escribe lo que escuchaste',focus:'#parac'};
      return{ok:true,label:`Mostrárselo a ${N(k)} ➜`,onNext:()=>{if(!DEFENSIVE.test(norm(m.para+' '+m.valid)))badge('sinpero');set('hand2');}};
    });

  if(m.phase==='hand2'){app.innerHTML=handoffHTML(k,`Devuélvele el celular a ${N(k)}`,`${esc(N(l))} intentó ponerse en tu lugar. Léelo con calma.`);setGate(()=>({ok:true,label:`Soy ${N(k)}, a ver ➜`,onNext:()=>set('check')}));return;}
  if(m.phase==='check'){

    <div class="scene"><div class="sa" id="avK">${avatarSVG(k,deepK?deepK.k:'tristeza')}${esc(N(k))}</div><div class="mid">💭</div><div class="sa" id="avL">${avatarSVG(l,m.feel?WHEEL[m.feel.f].k:'calma')}${esc(N(l))}</div></div>
    <div class="card">${fe?`<div class="tr-row"><span class="tr-k">Si me lo hubieran hecho a mí, me sentiría</span><span class="tr-v">${WHEEL[m.feel.f].e} ${esc(fe)}</span></div>`:''}
    ${m.para.trim()?`<div class="tr-row"><span class="tr-k">Lo que te escucho decir es</span><div class="say">${esc(m.para)}</div></div>`:''}
    ${m.valid.trim()?`<div class="tr-row"><span class="tr-k">Tiene sentido porque</span><div class="say">${esc(m.valid)}</div></div>`:''}</div>

      $('#mi').oninput=e=>{m.missing=e.target.value;save();};
      const en=$('#enough');if(en)en.onclick=()=>set('done');};
    $$('[data-sc]').forEach(b=>b.onclick=()=>{m.score=+b.dataset.sc;save();$$('[data-sc]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));

    paintMiss();

      return{ok:true,label:'Devolverle el celular para otro intento ➜',onNext:()=>{m.tries++;m.score=null;set('hand');}};

  setGate(()=>({ok:true,label:k===S.first?`Siguiente: turno de ${N(l)} ➜`:'Siguiente: el acuerdo ➜'}));

V.acuerdo=()=>{
  const A=S.agree,juntos=S.mode==='juntos',ids=juntos?[0,1]:[0];
  const reqs=[0,1].filter(i=>P(i).request.trim()).map(i=>({i,t:P(i).request.trim()}));
  const WHEN=['Hoy mismo','Cada noche','Esta semana','Cada vez que discutamos'],CHECK=['El domingo','En 3 días','En una semana'];
  app.innerHTML=head('acuerdo',null,juntos?'Un acuerdo pequeño para esta semana':'Una propuesta pequeña para llevarle',juntos?null:`Elige una sola acción concreta que le propondrás a ${esc(N(1))} cuando hablen.`)+`
  <div class="card" id="wc"><h3>1 · ¿Qué ${juntos?'van a hacer':'le vas a proponer'}?</h3><div class="chips sm" style="margin-bottom:10px">${reqs.map(r=>`<button type="button" class="chip" data-t="${esc(r.t)}" aria-pressed="${A.what===r.t}">🎁 Pedido de ${esc(N(r.i))}: ${esc(r.t)}</button>`).join('')}${AGREE_T.map(t=>`<button type="button" class="chip" data-t="${esc(t)}" aria-pressed="${A.what===t}">${esc(t)}</button>`).join('')}</div>
  <textarea id="what" rows="2" placeholder="O escríbelo: algo que una cámara pueda ver">${esc(A.what)}</textarea><div id="vague"></div></div>
  <div class="card"><h3>2 · ¿Cuándo?</h3><div class="chips">${WHEN.map(w=>`<button type="button" class="chip" data-when="${esc(w)}" aria-pressed="${A.when===w}">${w}</button>`).join('')}</div>
  <h3 style="margin-top:16px">3 · ¿Cuándo lo revisan?</h3><div class="chips">${CHECK.map(w=>`<button type="button" class="chip" data-check="${esc(w)}" aria-pressed="${A.check===w}">${w}</button>`).join('')}</div></div>
  <div class="card fun center" id="seal"><h3>${juntos?'✋ Sellen el pacto':'✋ Sella tu compromiso'}</h3><p class="hint">Mantén presionado ${juntos?'tu':'el'} botón hasta que se llene.</p>
  <div class="scene">${juntos?`<div class="sa" id="ag0">${avatarSVG(0,A.ok[0]?'felicidad':'neutral')}</div><div class="mid">🤝</div><div class="sa" id="ag1">${avatarSVG(1,A.ok[1]?'felicidad':'neutral')}</div>`:`<div></div><div class="sa" id="ag0">${avatarSVG(0,A.ok[0]?'felicidad':'neutral')}</div><div></div>`}</div>
  <div class="grid2" style="${juntos?'':'grid-template-columns:1fr'}">${ids.map(i=>`<button type="button" class="btn ghost hold ${A.ok[i]?'done':''}" data-ok="${i}"><span>${A.ok[i]?'✓ ':''}${juntos?`${esc(N(i))} acepta`:'Me comprometo a proponerlo'}</span></button>`).join('')}</div></div>`;
  const paintV=()=>{const vague=/\b(intentar|intentare|tratar|tratare|mejorar|mejor|comunicarnos)\b/.test(norm(A.what));$('#vague').innerHTML=vague?'<p class="hint" style="margin-top:8px">💡 «Intentar», «mejor» o «comunicarnos» son difíciles de cumplir. ¿Cómo se vería en una cámara?</p>':'';};
  $$('[data-t]').forEach(b=>b.onclick=()=>{A.what=b.dataset.t;$('#what').value=A.what;$$('[data-t]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));save();paintV();});
  $('#what').oninput=e=>{A.what=e.target.value;$$('[data-t]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.t===A.what)));save();paintV();};
  $$('[data-when]').forEach(b=>b.onclick=()=>{A.when=b.dataset.when;$$('[data-when]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));save();});
  $$('[data-check]').forEach(b=>b.onclick=()=>{A.check=b.dataset.check;$$('[data-check]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));save();});
  $$('[data-ok]').forEach(b=>{const i=+b.dataset.ok;if(A.ok[i])return;holdify(b,()=>{
    if(!A.what.trim()){toast('Primero elige qué van a hacer');nudge('#wc');b.style.setProperty('--p',0);return;}
    A.ok[i]=true;save();b.classList.add('done');$('span',b).textContent='✓ '+$('span',b).textContent;setAv($('#ag'+i),'felicidad');
    if(ids.every(x=>A.ok[x])){if(award('acuerdo',25,b))badge('acuerdo');else confetti(innerWidth/2,innerHeight/2,80);ids.forEach(x=>setAv($('#ag'+x),'amor'));}
    updateNav();});});
  paintV();
  setGate(()=>{
    if(A.what.trim().length<6)return{ok:false,msg:juntos?'Elijan o escriban un acuerdo':'Elige o escribe una propuesta',focus:'#wc'};
    if(!A.when)return{ok:false,msg:'Elige cuándo',focus:'[data-when]'};
    const miss=ids.find(i=>!A.ok[i]);if(miss!=null)return{ok:false,msg:juntos?`Falta que ${N(miss)} selle el pacto`:'Mantén presionado para sellar',focus:'#seal'};
    return{ok:true,label:'Ir al cierre ➜'};
  });
};

function summaryText(){
  const ids=S.mode==='juntos'?[0,1]:[0],A=S.agree,L=[];
  L.push('MI BRÚJULA EMOCIONAL — '+new Date().toLocaleDateString('es',{day:'numeric',month:'long',year:'numeric'}),'');
  ids.forEach(i=>{const p=P(i),d=p.dig;L.push(N(i).toUpperCase());
    if(p.now)L.push('• Lo que sentía: '+selWord(p.now,p.g));
    if(p.camera.trim())L.push('• Lo que pasó: '+p.camera.trim());
    if(d.surf)L.push('• Por fuera se veía: '+selWord(d.surf,p.g));
    if(d.deep)L.push('• Por dentro: '+selWord(d.deep,p.g));
    const fw=fearWord(d,p.g);if(fw)L.push('• Miedo de fondo: que '+fw);
    if(p.needs.length)L.push('• Necesidad: '+p.needs.map(n=>G(n,i)).join(', '));
    if(p.script.trim())L.push('• Mi mensaje: '+p.script.trim());
    if(p.appr.trim())L.push('• Algo que valoro de '+N(1-i)+': '+p.appr.trim());
    L.push('• Temperatura: '+(p.t0??'–')+' → '+(p.tEnd??'–'),'');});
  if(S.repair)L.push('Frase de reparación: '+G(S.repair,0),'');
  if(A.what.trim()){L.push(S.mode==='juntos'?'ACUERDO':'PROPUESTA');L.push('• '+A.what.trim());if(A.when)L.push('• Cuándo: '+A.when);if(A.check)L.push('• Lo revisamos: '+A.check);}
  L.push('',`💗 ${S.xp} corazones · ${S.badges.length} logros`);
  return L.join('\n');
}

function bindMoodPad(p,onChange){
  const pad=$('#mpad');if(!pad)return;
  const set=e=>{const r=pad.getBoundingClientRect();const x=Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width)*2-1)),y=Math.max(-1,Math.min(1,1-((e.clientY-r.top)/r.height)*2));p.mood={x:+x.toFixed(2),y:+y.toFixed(2)};const d=$('.mdot',pad);d.hidden=false;d.style.left=(x+1)*50+'%';d.style.top=(1-y)*50+'%';const q=QUAD[quadOf(p.mood)];$('#mlbl').textContent=`${q.e} ${q.n}`;};
  let down=false;
  pad.addEventListener('pointerdown',e=>{down=true;try{pad.setPointerCapture(e.pointerId)}catch(_){}set(e);});
  pad.addEventListener('pointermove',e=>{if(down)set(e);});
  const up=()=>{if(!down)return;down=false;save();vib(12);onChange&&onChange();updateNav();};
  pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);
}

V.iceberg=i=>{

    if(st===1)wheelPicker($('#wpk'),{g,ai:i,sel:p.now,prompt:'Por dentro siento…',sug:sugIn,onChange:s=>{p.now=s;save();}});
    if(st===2){const inF=p.now?WHEEL[p.now.f].k:'';wheelPicker($('#wpk'),{g,ai:i,sel:p.under,prompt:'Más al fondo hay…',sug:['ira','asco'].includes(inF)?['tristeza','miedo']:[],dim:p.now?[inF]:[],onChange:s=>{p.under=s;save();}});}
  }
  const sub=n=>{p.istep=n;save();if(n===3&&award('fondo'+i,25,ex))badge('fondo');paint();updateNav();window.scrollTo({top:0,behavior:RM?'auto':'smooth'});};
  paint();

    const line=key=>last.map((r,k)=>r[key]!=null?[px(k),py(r[key])]:null).filter(Boolean);
    const pts0=line('t0'),pts1=line('tEnd');
    const poly=(pts,c)=>pts.length>1?`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:'';
    const dots=(key,c,lbl)=>last.map((r,k)=>r[key]!=null?`<circle cx="${px(k)}" cy="${py(r[key])}" r="4" fill="${c}" stroke="var(--surface)" stroke-width="2"><title>${new Date(r.date).toLocaleDateString('es',{day:'numeric',month:'short'})} · ${lbl}: ${r[key]}</title></circle>`:'').join('');
    body=`<div class="card"><h3>🔎 Lo que dicen tus registros</h3><ul class="tips">${ins.map(x=>`<li>${x}</li>`).join('')}</ul><p class="hint">${tot} registro${tot>1?'s':''} en total.</p></div>
    <div class="card"><h3>Emociones más frecuentes</h3>${byFam.map(({F,n})=>`<div class="pbar" title="${F.n}: ${n}"><span class="pl">${F.e} ${F.n}</span><div class="ptrack"><i style="width:${n/max*100}%;background:${F.c}"></i></div><span class="pv">${n}</span></div>`).join('')}</div>
    ${last.length>1?`<div class="card"><h3>Intensidad en tus últimas sesiones</h3><div class="legend"><span><i style="background:var(--warm)"></i>Al empezar</span><span><i style="background:var(--accent)"></i>Al terminar</span></div>
      <svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Intensidad al empezar y al terminar en las últimas sesiones">${[0,5,10].map(v=>`<line x1="14" x2="${W-6}" y1="${py(v)}" y2="${py(v)}" stroke="var(--line)" stroke-width="1"/><text x="2" y="${py(v)+3}" class="ax">${v}</text>`).join('')}${poly(pts0,'var(--warm)')}${poly(pts1,'var(--accent)')}${dots('t0','var(--warm)','Al empezar')}${dots('tEnd','var(--accent)','Al terminar')}</svg><p class="hint">Toca un punto para ver la fecha.</p></div>`:''}
    ${needs.length?`<div class="card"><h3>Lo que más necesitas</h3><div class="chips sm">${needs.map(([n,c])=>`<span class="chip static">${esc(gx(n,P(0).g))} · ${c}</span>`).join('')}</div></div>`:''}
    ${trigList.length?`<div class="card"><h3>Qué te activa</h3><ul class="saved">${trigList.map(x=>`<li><span>${esc(x.t)}</span><span style="margin-left:auto;font-weight:700">${x.F.e} ${esc(x.F.n)} <span class="hint">(${x.n} de ${x.tot})</span></span></li>`).join('')}</ul></div>`:''}
    <details class="card"><summary>Ver todos los registros</summary><ul class="hist">${rows.slice().reverse().map(r=>{const F=WHEEL.find(f=>f.k===r.fam);return`<li><b>${esc(new Date(r.date).toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric'}))}</b> · ${F.e} ${esc(r.word||F.n)}${r.trig?` · ${esc(r.trig)}`:''} · ${r.t0??'–'} → ${r.tEnd??'–'}</li>`;}).join('')}</ul></details>`;
  }
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="patT"><div class="sheet-head"><h2 id="patT">📊 Mis patrones</h2><button type="button" class="icon-btn" id="patX" aria-label="Cerrar">✕</button></div>${body}</div>`;
  $('#patX').onclick=closeSheet;
}

/* ================= pausa y rueda libre ================= */
let ovTimers=[];
const fmt=ms=>{const s=Math.ceil(ms/1000);return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
function clearOv(){ovTimers.forEach(t=>{clearTimeout(t);clearInterval(t)});ovTimers=[];}
function openSheet(){ov.hidden=false;document.body.style.overflow='hidden';}
function closeSheet(){clearOv();ov.hidden=true;ov.innerHTML='';document.body.style.overflow='';}
function openPause(){openSheet();paintPause();}
function paintPause(){
  clearOv();
  const active=S.pauseUntil&&S.pauseUntil>Date.now();
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pt">
  <div class="sheet-head"><h2 id="pt">⏸️ Pausa</h2><button type="button" class="icon-btn" id="pClose" aria-label="Cerrar">✕</button></div>
  ${active?`<div class="card soft center"><div class="avw">${avatarSVG(0,'zen')}</div><p class="hint">Pausa en curso · vuelven a las ${hhmm(S.pauseUntil)}</p><div class="big-timer" id="pTime"></div><p>Hagan algo que calme el cuerpo: caminar, tomar agua, música. Evita repasar la pelea en tu cabeza.</p><button type="button" class="btn ghost small" id="pStop">Terminar la pausa</button></div>`
  :`<p class="lead">Cuando alguien pasa de 7, la conversación deja de servir. Parar no es huir: es cuidar la conversación. Quien pide la pausa dice a qué hora vuelve.</p>
  <div class="grid2"><button type="button" class="btn primary" id="pBreath">🌬️ Respirar 1 min</button><button type="button" class="btn ghost" id="p20">⏱️ Pausa de 20 min</button></div><div id="pBz"></div>`}
  <h3 style="margin-top:18px">🩹 Frases de reparación</h3><p class="hint">Para frenar la escalada en el momento.</p>
  <ul class="repair">${REPAIR.map(r=>`<li>${esc(gx(r,P(0).g))}</li>`).join('')}</ul><p class="hint" style="margin-top:14px">🆘 Si sientes que no puedes más o piensas en hacerte daño: <a href="https://findahelpline.com/es" target="_blank" rel="noopener">busca la línea de ayuda de tu país</a> o llama a emergencias.</p></div>`;
  $('#pClose').onclick=closeSheet;
  if(active){
    const tick=()=>{const ms=S.pauseUntil-Date.now();if(ms<=0){S.pauseUntil=null;save();vib([200,100,200]);paintPause();toast('Terminó la pausa. Vuelvan cuando los dos estén por debajo de 5.');return;}const el=$('#pTime');if(el)el.textContent=fmt(ms);};
    tick();ovTimers.push(setInterval(tick,1000));
    $('#pStop').onclick=()=>{S.pauseUntil=null;save();paintPause();};
  }else{
    $('#pBreath').onclick=()=>breathe($('#pBz'),5,()=>{paintPause();toast('Bien hecho 🌬️');badge('calma');},ovTimers,[0]);
    $('#p20').onclick=()=>{S.pauseUntil=Date.now()+20*60*1000;save();paintPause();};
  }
}
function openWheel(){
  openSheet();
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="wt"><div class="sheet-head"><h2 id="wt">🎡 Rueda de emociones</h2><button type="button" class="icon-btn" id="wClose" aria-label="Cerrar">✕</button></div>
  <p class="hint">Ponerle un nombre preciso a lo que sientes baja su intensidad. Del centro (lo básico) hacia afuera (lo más preciso). Familias exploradas: ${S.seen.length} de 6.</p><div id="wfree"></div>
  <div id="wneed" class="card soft" style="margin-top:12px" hidden></div></div>`;
  $('#wClose').onclick=closeSheet;
  wheelPicker($('#wfree'),{g:P(0).g,ai:0,prompt:'Lo que siento se llama…',onChange:s=>{const M=s.m!=null?WHEEL[s.f].m[s.m]:null;const w=$('#wneed');if(M&&M[2]){w.hidden=false;w.innerHTML=`💚 Cuando te sientes <b>${esc(selWord(s,P(0).g).toLowerCase())}</b>, quizá necesitas <b>${esc(gx(M[2],P(0).g).toLowerCase())}</b>.`;}else w.hidden=true;}});
}
ov.addEventListener('click',e=>{if(e.target===ov)closeSheet();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ov.hidden)closeSheet();});
$('#pauseBtn').onclick=openPause;
$('#wheelBtn').onclick=openTools;
$('#patBtn').onclick=openPatterns;
$('#xp').onclick=()=>toast(`💗 ${S.xp} corazones · ${S.badges.length} de ${Object.keys(BADGES).length} logros`);
setInterval(()=>{const b=$('#pauseBtn');b.textContent=S.pauseUntil&&S.pauseUntil>Date.now()?'⏸ '+fmt(S.pauseUntil-Date.now()):'Pausa';},1000);

/* ================= tema ================= */
const THEMES=[['auto','◐','Tema automático'],['light','☀️','Tema claro'],['dark','🌙','Tema oscuro']];
function applyTheme(t){const r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);const th=THEMES.find(x=>x[0]===t)||THEMES[0];const b=$('#themeBtn');b.textContent=th[1];b.setAttribute('aria-label',th[2]+' (tocar para cambiar)');b.title=th[2];}
let theme='auto';try{theme=localStorage.getItem(TKEY)||'auto';}catch(e){}
applyTheme(theme);
$('#themeBtn').onclick=()=>{const k=THEMES.findIndex(x=>x[0]===theme);theme=THEMES[(k+1)%THEMES.length][0];try{localStorage.setItem(TKEY,theme);}catch(e){}applyTheme(theme);toast(THEMES.find(x=>x[0]===theme)[2]);};

render();
</script>
</body>
</html>
